[project]
name = "windshift"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.34.0",
  "tzdata==2025.2",
  "annotated-types==0.8.0",
  "annotated-doc==0.0.5",
  "anyio==4.15.1",
  "click==8.5.0",
  "colorama==0.4.6; sys_platform == 'win32'",
  "h11==0.16.0",
  "idna==3.20",
  "pydantic==2.14.1",
  "pydantic_core==2.50.1",
  "opentelemetry-api==1.45.1",
  "starlette==1.9.0",
  "typing-inspection==0.4.4",
  "typing_extensions==4.16.0",
]

[tool.vercel]
entrypoint = "backend.app:app"
